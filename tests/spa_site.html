<!doctype html>
<html><body><div id="app"></div>
<script>
// A fake single-page app like Thermpix: the login lives only in memory, so
// loading any address directly lands back on the login page.
let token = null;
let listPage = 1;
const PER_PAGE = 2;
const app = document.getElementById("app");
const menu = `<nav><span onclick="nav('/dashboard')">Dashboard</span> <span>Entities</span>
  <span>Clinics</span> <span>Users</span>
  <a href="/patients" onclick="event.preventDefault()"><mat-icon>groups</mat-icon> Patients</a>
  <span>Devices</span></nav>`;

function nav(path) { history.pushState({}, "", path); if (path === "/patients/patients") listPage = 1; render(); }
window.addEventListener("popstate", () => { listPage = 1; render(); });  // like a fresh component

async function render() {
  const path = location.pathname;
  if (!token && path !== "/login") { history.replaceState({}, "", "/login"); return render(); }
  if (path === "/login") {
    app.innerHTML = `<form id="f"><input type="text" name="username"><input type="password" name="password">
      <button type="submit">Sign in</button></form><div id="err"></div>`;
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const body = new URLSearchParams(new FormData(e.target)).toString();
      const r = await fetch("/api/login", { method: "POST", body });
      if (r.ok) { token = (await r.json()).token; nav("/dashboard"); }
      else document.getElementById("err").innerHTML = '<div role="alert">Invalid username or password</div>';
    };
    return;
  }
  const data = await (await fetch("/api/data", { headers: { Authorization: token } })).json();
  if (path === "/dashboard") {
    const recent = Object.keys(data.patients).slice(0, 2).map(id => `<tr role="row"><td>${data.patients[id]}</td>
      <td><button aria-label="Details" onclick="nav('/patients/patient/${id}')"><svg></svg></button></td></tr>`).join("");
    app.innerHTML = menu + `<h3>Recently Created Patients</h3><table><thead><tr role="row">
      <th role="columnheader">Patient</th><th role="columnheader"></th></tr></thead><tbody>${recent}</tbody></table>`;
    return;
  }
  if (path === "/patients/patients" && !window.listLoaded) {
    app.innerHTML = menu + `<table><tbody><tr><td>Loading...</td></tr></tbody></table>`;
    window.listLoaded = true;
    setTimeout(render, 1500);
    return;
  }
  if (path === "/patients/patients") {
    const ids = Object.keys(data.patients);
    const chunk = ids.slice((listPage - 1) * PER_PAGE, listPage * PER_PAGE);
    const rows = chunk.map(id => `<tr mat-row role="row"><td>${id}</td><td>${data.patients[id].split(" ")[1]}</td>
      <td>${data.patients[id].split(" ")[0]}</td><td>1980</td>
      <td><button aria-label="Details" onclick="nav('/patients/patient/${id}')"><mat-icon><svg width="24" height="24"></svg></mat-icon></button>
      <button aria-label="Edit" onclick="alert('edit?')"><mat-icon><svg width="24" height="24"></svg></mat-icon></button></td></tr>`).join("");
    const more = listPage * PER_PAGE < ids.length;
    app.innerHTML = menu + `<table><thead><tr role="row"><th role="columnheader">Patient number</th><th role="columnheader">Last name</th>
      <th role="columnheader">First name</th><th role="columnheader">Birthday</th><th role="columnheader"></th></tr></thead><tbody>${rows}</tbody></table>
      <button aria-label="Next page" ${more ? "" : "disabled"} onclick="listPage++; render()">&gt;</button>`;
    return;
  }
  const m = path.match(/^\/patients\/patient\/(\w+)$/);
  if (m) {
    app.innerHTML = menu + `<main><div class="ov-header__text"><p>${data.patients[m[1]]}</p></div>
      <div role="tablist"><span role="tab">Overview</span> <span role="tab" id="images-tab">Images</span></div>
      <div id="tab-body">Overview of the patient</div></main>`;
    const imgs = data.images[m[1]] || [];
    const drawImages = (selecting) => {
      // Like Thermpix: images grouped under a date heading (day/month/year).
      const groups = {};
      imgs.forEach(img => { const d = data.dates[img] || data.today; (groups[d] = groups[d] || []).push(img); });
      const cards = Object.entries(groups).map(([d, list]) => `<div class="image-group">
          <div class="image-group__header"><p>${d}</p></div><div class="image-group__pics-wrapper">` +
        list.map(img => `<sc-image-card class="image-card">
          ${selecting ? `<div class="form-check custom-checkbox archive"><input type="checkbox" value="${img}"
            style="position:absolute;width:1px;height:1px;opacity:0"></div>` : ""}
          <img src="/files/${img}.jpg?sig=${Math.random()}" width="80" height="60"></sc-image-card>`).join("") +
        `</div></div>`).join("");
      // Like Thermpix: "Select image" swaps in a toolbar that includes a red Archive button.
      document.getElementById("tab-body").innerHTML = selecting ? `<div class="toolbar">
          <button><span class="material-symbols-outlined">keep</span><span>Pin images</span></button>
          <button id="download" mattooltip="Download images"><mat-icon>download_outlined</mat-icon><span>Download images</span></button>
          <button id="archive" class="bg-red-500"><span class="material-symbols-outlined">archive</span><span>Archive</span></button>
          <button><span class="material-symbols-outlined">cancel</span><span>Cancel</span></button>
        </div><div class="images">${cards}</div>` : `<div class="toolbar">
          <button id="select"><span class="material-symbols-outlined">check_box</span><span>Select image</span></button>
        </div><div class="images">${cards}</div>`;
      if (!selecting) { document.getElementById("select").onclick = () => drawImages(true); return; }
      document.getElementById("archive").onclick = () => fetch("/api/archive", { method: "POST" });
      document.getElementById("download").onclick = () => {
        const ticked = [...document.querySelectorAll(".images input:checked")].map(b => b.value);
        if (ticked.length !== 1) { alert("tick exactly one image"); return; }
        const a = document.createElement("a");
        a.href = `/files/${ticked[0]}.jpg`; a.download = `${ticked[0]}.jpg`;
        document.body.appendChild(a); a.click(); a.remove();
      };
    };
    document.getElementById("images-tab").onclick = () => drawImages(false);
  }
}
render();
</script></body></html>
